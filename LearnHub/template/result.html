{% include 'nav.html' %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Result</title>
    <style>
        .xyz {
            display: flex;
            /* Use flexbox for centering */
            justify-content: center;
            /* Center horizontally */
            align-items: center;
            /* Center vertically */
            min-height: 100vh;
            /* Full viewport height */
            margin: 0;
            background-color: white;
            font-family: 'Arial', sans-serif;
            /* A more common and readable font */
        }
        
        .result-container {
            background: #ffffff;
            /* White background for a cleaner look */
            padding: 40px 50px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            /* More pronounced shadow */
            max-width: 500px;
            /* Increased max-width for better desktop appearance */
            width: 90%;
            /* Occupy 90% of the width on smaller screens, allowing some margin */
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInRise 0.8s ease-out forwards;
            border: 1px solid #e0e0e0;
            /* Subtle border */
        }
        
        @keyframes fadeInRise {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 32px;
        }
        
        p {
            font-size: 20px;
            margin: 20px 0;
        }
        
        strong {
            color: #3498db;
            font-weight: 700;
        }
        
        .btn.retake {
            display: inline-block;
            padding: 10px 20px;
            background-color: red;
            /* red tone for 'retake' */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
            text-decoration: none;
        }
        
        .btn.retake:hover {
            background-color: #2ed628;
            /* darker red on hover */
        }
        
        .btn-download {
            display: inline-block;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
            transition: background-color 0.3s ease, transform 0.2s ease;
            /* Add transform for hover animation */
            margin-top: 20px;
        }
        
        .btn-download:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            /* Slight lift on hover */
        }
        
        .message-fail {
            color: #e74c3c;
            margin-top: 30px;
            font-weight: 600;
        }
        /* Media queries for smaller screens */
        
        @media (max-width: 500px) {
            .result-container {
                padding: 30px 20px;
                /* Adjust padding for smaller screens */
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 18px;
            }
            .btn-download {
                padding: 12px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="xyz">
        <div class="result-container">
            <h1>Quiz Result 📝</h1>
            <p>Your score: <strong>{{ score }}/60</strong></p>

            {% if certificate_available %}
            <button class="btn btn-download"> <a href="{% url 'viewc' %}" class="btn">Download Certificate</a></button> {% else %}
            <p class="fail-msg">You did not pass the quiz.</p>
            <button class="btn retake"> <a href="{% url 'quiz' %}" >Retake Quiz</a></button> {% endif %}


        </div>
    </div>
    {% include 'footer.html' %}
</body>

</html>
