<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Login - LearningHub</title>
    <style>
        /* Basic styling */
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f6f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        form {
            background: #fff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        /* LearningHub title */
        
        .title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #008cff;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 2px;
            animation: fadeInDown 1s ease forwards;
        }
        
        h2 {
            margin-bottom: 25px;
            text-align: center;
        }
        
        input {
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
            width: 100%;
        }
        
        button {
            background-color: #008cff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #006bb3;
        }
        
        .error {
            color: red;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .link {
            margin-top: 15px;
            text-align: center;
        }
        
        .link a {
            color: #008cff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .link a:hover {
            color: #006bb3;
        }
        /* Responsive tweaks */
        
        @media (max-width: 400px) {
            form {
                padding: 30px 20px;
                width: 100%;
            }
            input,
            button {
                font-size: 0.9rem;
                padding: 10px;
            }
            h2 {
                font-size: 1.4rem;
                margin-bottom: 20px;
            }
            .title {
                font-size: 2rem;
                margin-bottom: 20px;
            }
        }
        /* Animation */
        
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <form method="POST" action="">
        {% csrf_token %}
        <div class="title">LearningHub</div>
        <h2>Sign In</h2>

        {% if messages %} {% for message in messages %}
        <div class="error">{{ message }}</div>
        {% endfor %} {% endif %}

        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>

        <div class="link">
            <a href="{% url 'register' %}">Don't have an account? Register</a>
        </div>
    </form>
</body>

</html>
