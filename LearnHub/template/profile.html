<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ profile.name }} – Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-100 to-white min-h-screen flex items-center justify-center">

    {% if profile %}
    <div class="max-w-xl w-full bg-white rounded-2xl shadow-lg p-8 text-center">

        <!-- Profile Image -->
        <img src="{{ profile.photo.url }}" alt="{{ profile.name }}" class="w-32 h-32 rounded-full mx-auto object-cover border-4 border-blue-200 shadow" />

        <!-- Name -->
        <h1 style="font-size: xx-large; color:black;" class="mt-4 text-3xl font-extrabold text-blue-700 tracking-tight">{{ profile.name }}</h1>

        <!-- Title -->
        <p class="mt-1 text-lg text-purple-600 font-medium">{{ profile.title }}</p>

        <!-- Bio -->
        <p class="mt-4 text-gray-700 leading-relaxed text-base">
            {{ profile.bio }}
        </p>

        <!-- Email -->
        {% if profile.email %}
        <div class="mt-6">
            <a href="mailto:{{ profile.email }}" class="text-blue-600 hover:underline text-sm">
        📧 {{ profile.email }}
      </a>
        </div>
        {% endif %}

        <!-- Action Buttons -->
        <div class="mt-6 space-x-4">
            <a href="{% url 'update_profile' profile.pk %}" class="inline-block px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded hover:bg-blue-700">
        Edit Profile
      </a>
            <a href="{% url 'profile_redirect' %}" class="inline-block px-4 py-2 bg-gray-200 text-gray-800 text-sm font-semibold rounded hover:bg-gray-300">
        Back to My Profile
      </a>
        </div>

    </div>

    {% else %}
    <div class="bg-white shadow-lg rounded-xl p-8 max-w-lg text-center">
        <h2 class="text-2xl font-semibold text-gray-800">No profile found</h2>
        <p class="text-gray-600 mt-2">Looks like you haven't created your profile yet.</p>
        <a href="{% url 'create_profile' %}" class="mt-4 inline-block px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
      Create Profile
    </a>
    </div>
    {% endif %}

</body>

</html>
