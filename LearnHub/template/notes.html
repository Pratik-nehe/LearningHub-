{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>

    <!-- Static CSS Files -->
    <link href="{% static 'css/video.css' %}" rel="stylesheet">

    <!-- If using Tailwind CSS, ensure it's linked in your base layout or here -->
</head>

<body class="bg-pink-50 min-h-screen">

    <!-- Navbar -->
    {% include 'nav.html' %}

    <main class="max-w-7xl mx-auto px-6 py-16 space-y-24">

        <!-- Page Title -->
        <h1 class="text-5xl font-extrabold mb-12 text-center text-blue-700 tracking-wide">Notes</h1>

        <!-- Notes Grid -->
        <ul class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
            {% for note in n %}
            <li>
                <div class="bg-white border border-gray-200 rounded-xl shadow-md hover:shadow-2xl hover:scale-105 transform transition duration-300 ease-in-out p-6 flex flex-col items-center space-y-4">
                    <h3 class="text-2xl font-semibold text-center text-gray-800 tracking-wide">{{ note.title }}</h3>

                    <!-- PDF Link -->
                    <button> <a href="{{ note.pdf_file.url }}" target="_blank" ownload class="bg--600 text-white px-4 py-2 rounded-full hover:bg-blue-700 transition" >📄 View PDF</button>
                    </a>

                    <!-- Download Button -->
                    <a href="{{ note.pdf_file.url }}" download class="bg-red-600 text-white px-4 py-2 rounded-full hover:bg-blue-700 transition">
        ⬇️ Download PDF
    </a>
                </div>

            </li>
            {% empty %}
            <li class="col-span-full text-center text-gray-500">No notes found.</li>
            {% endfor %}
        </ul>

    </main>

    <!-- Footer -->
    {% include 'footer.html' %}

</body>

</html>
