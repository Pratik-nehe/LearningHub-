{% load static %} {% include 'nav.html' %} {% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnHub | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/learnhub.css' %}" />
    <script src="{% static 'java scripts/learnhub.js' %}"></script>
</head>

<body style="background-color: white;">
    <!-- Navigation Bar -->

    <!-- Contact Section -->
    <section id="contact" class="py-16 sm:py-20 bg-gradient-to-br from-black to-gray-900">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold text-center text-white mb-10 sm:mb-12">Get in Touch</h2>

            <div class="bg-white p-6 sm:p-10 rounded-xl shadow-2xl max-w-2xl mx-auto">
                <form method="POST" action="">
                    {% csrf_token %}
                    <div class="mb-5">
                        <label for="name" class="block text-base sm:text-lg font-semibold text-gray-700 mb-2">Name</label>
                        <input type="text" id="name" name="name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Your Name" required />
                    </div>

                    <div class="mb-5">
                        <label for="email" class="block text-base sm:text-lg font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="you@example.com" required />
                    </div>

                    <div class="mb-6">
                        <label for="message" class="block text-base sm:text-lg font-semibold text-gray-700 mb-2">Message</label>
                        <textarea id="message" name="message" rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Write your message here..." required></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-base sm:text-lg font-semibold py-3 px-8 rounded-full transition-all duration-300 shadow-md hover:shadow-lg">
                            Send Message
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    {% include 'footer.html' %}
</body>

</html>
{% endblock %}
